name: last-fm-recent-tracks

# No lint job on PRs: lint-app.yml is Node-specific (npm ci/format/lint/
# typecheck), and this app is plain Python with no extra tooling to run
# that against. deploy-app.yml's Trivy image scan still covers it like
# every other app. The PR-only build-check job below catches a builder/
# runtime python mismatch (see the Dockerfile) before it reaches main —
# #36 and #41 both shipped one because nothing built the image pre-merge.
on:
  pull_request:
    paths:
      - "last-fm/recent-tracks/**"
      - ".github/workflows/last-fm-recent-tracks.yml"
  push:
    branches: [main]
    paths:
      - "last-fm/recent-tracks/**"
      - ".github/workflows/last-fm-recent-tracks.yml"
      - ".github/workflows/deploy-app.yml"

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t recent-tracks:pr last-fm/recent-tracks
      # Importing the deps (not main.py, which needs runtime env vars)
      # loads every compiled extension against the runtime interpreter.
      - run: docker run --rm recent-tracks:pr -c "import _cffi_backend, google.cloud.bigquery, requests"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-app.yml
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      app_path: last-fm/recent-tracks
      service_name: lastfm-recent-tracks
      region: us-west1
      project_id: elliotx
      artifact_registry_repo: recent-tracks
      workload_identity_provider: projects/362369312254/locations/global/workloadIdentityPools/apps-github-pool/providers/apps-github-provider
      service_account: lastfm-recent-tracks-ci@elliotx.iam.gserviceaccount.com
