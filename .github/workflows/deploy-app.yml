name: Deploy app

# Reusable workflow: build+push an image to GAR via WIF, deploy it to Cloud
# Run. Adding a new app means adding a thin caller workflow with its own
# inputs, not duplicating these steps — see last-fm-now-playing.yml.
on:
  workflow_call:
    inputs:
      app_path:
        description: Path to the app's directory (Docker build context)
        required: true
        type: string
      service_name:
        description: Cloud Run service name
        required: true
        type: string
      region:
        required: true
        type: string
      project_id:
        required: true
        type: string
      artifact_registry_repo:
        description: Artifact Registry repository ID (not the full path)
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      service_account:
        description: GCP service account this workflow impersonates via WIF
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Build image
        id: image
        run: |
          IMAGE="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.artifact_registry_repo }}/${{ inputs.service_name }}:${{ github.sha }}"
          docker build -t "$IMAGE" "${{ inputs.app_path }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Scans the image we just built, before it's pushed anywhere. Reports
      # findings to the Security tab (same as CodeQL) rather than blocking
      # the deploy: most findings here land in the base image's OS layer,
      # which we don't control and can't patch faster than its own
      # maintainer does — blocking every deploy on that turned out to be
      # pure roulette (three separate base-image swaps here, three new
      # categories of finding, in the space of an hour). The base image is
      # pinned by digest in the Dockerfile, so Dependabot proposes updates
      # on its own schedule instead of this gating today's app-code deploy.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload scan results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push image
        run: docker push "${{ steps.image.outputs.image }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ inputs.service_name }}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ inputs.region }}" \
            --project="${{ inputs.project_id }}" \
            --quiet
