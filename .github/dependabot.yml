version: 2
updates:
  # One entry per app — add a new one here alongside each new app folder.
  - package-ecosystem: npm
    directory: /last-fm/now-playing
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directory: /last-fm/now-playing
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /last-fm/recent-tracks
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /last-fm/recent-tracks
    schedule:
      interval: weekly
    # The builder's python minor must match the distroless runtime's
    # bundled interpreter (see the Dockerfile) — only allow digest/patch
    # bumps here; move to a new minor by hand alongside the runtime.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
